<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tickets - IPL 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation bar (links go back to index.html) -->
  <header>
    <nav>
      <a href="index.html">Home</a> |
      <a href="index.html#matches">Matches</a> |
      <a href="booking.html">Book Ticket</a> |
      <a href="index.html#bookings">My Bookings</a> |
      <a href="index.html#guidelines">Guidelines</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Ticket Booking Form</h2>

      <form action="#" method="post">

        <!-- Name: text, required, 3 to 50 characters -->
        <p>
          <label for="name">Full Name:</label><br>
          <input type="text" id="name" name="name"
                 required minlength="3" maxlength="50"
                 placeholder="Enter your full name">
        </p>

        <!-- Email: type="email" checks the format automatically -->
        <p>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email"
                 required placeholder="example@gmail.com">
        </p>

        <!-- Phone: exactly 10 digits -->
        <p>
          <label for="phone">Phone Number:</label><br>
          <input type="tel" id="phone" name="phone"
                 required pattern="[0-9]{10}" minlength="10" maxlength="10"
                 title="Enter a 10-digit phone number"
                 placeholder="10-digit mobile number">
        </p>

        <!-- Match: dropdown, first option is empty so user must choose -->
        <p>
          <label for="match">Select Match:</label><br>
          <select id="match" name="match" required>
            <option value="">-- Choose a match --</option>
            <option value="CSK vs MI">Match 1: CSK vs MI (Chennai)</option>
            <option value="RCB vs KKR">Match 2: RCB vs KKR (Bengaluru)</option>
          </select>
        </p>

        <!-- Stand category: dropdown -->
        <p>
          <label for="stand">Stand Category:</label><br>
          <select id="stand" name="stand" required>
            <option value="">-- Choose a stand --</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
          </select>
        </p>

        <!-- Number of tickets: min 1, max 6 -->
        <p>
          <label for="tickets">Number of Tickets (1 to 6):</label><br>
          <input type="number" id="tickets" name="tickets"
                 required min="1" max="6" value="1">
        </p>

        <!-- Radio buttons: choose ONE option -->
        <fieldset>
          <legend>Ticket Delivery:</legend>
          <label><input type="radio" name="delivery" value="E-Ticket" required> E-Ticket (Email)</label>
          <label><input type="radio" name="delivery" value="Stadium"> Collect at Stadium</label>
        </fieldset>

        <!-- Checkboxes: choose any number of options -->
        <fieldset>
          <legend>Additional Preferences:</legend>
          <label><input type="checkbox" name="extras" value="Parking"> Parking Pass</label>
          <label><input type="checkbox" name="extras" value="Meal"> Meal Combo</label>
          <label><input type="checkbox" name="extras" value="Jersey"> Team Jersey</label>
        </fieldset>

        <!-- Submit and Reset buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 IPL Ticket Booking. All rights reserved.</p>
  </footer>

</body>
</html>
